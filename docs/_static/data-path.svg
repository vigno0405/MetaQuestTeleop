<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">
  <title>The Quest tracks your hands; every frame goes over the USB cable to your computer, to your Python code, the live view and other programs</title>
  <defs>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e64b35"/></marker>
    <marker id="navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#13294b"/></marker>
  </defs>
  <rect width="760" height="230" rx="10" fill="#ffffff"/>

  <rect x="16" y="40" width="210" height="150" rx="12" fill="#eef3fa" stroke="#13294b" stroke-width="2"/>
  <text x="121" y="78" font-size="17" font-weight="700" fill="#13294b">Meta Quest</text>
  <text x="121" y="108" font-size="13.5" fill="#1f2a3a">a web page in its</text>
  <text x="121" y="130" font-size="13.5" fill="#1f2a3a">browser tracks</text>
  <text x="121" y="150" font-size="13.5" fill="#1f2a3a">your hands</text>
  <text x="121" y="174" font-size="12.5" fill="#5b6b82">up to 120 times a second</text>

  <line x1="228" y1="115" x2="334" y2="115" stroke="#e64b35" stroke-width="3" marker-end="url(#red)"/>
  <text x="280" y="100" font-size="13" font-weight="700" fill="#e64b35">USB cable</text>
  <text x="280" y="138" font-size="12.5" fill="#1f2a3a">every frame</text>

  <rect x="336" y="40" width="210" height="150" rx="12" fill="#eef3fa" stroke="#13294b" stroke-width="2"/>
  <text x="441" y="78" font-size="17" font-weight="700" fill="#13294b">Your computer</text>
  <text x="441" y="108" font-size="13.5" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" fill="#2b5797">metaquest-teleop</text>
  <text x="441" y="130" font-size="13.5" fill="#1f2a3a">receives the hands</text>
  <text x="441" y="150" font-size="13.5" fill="#1f2a3a">and passes them on</text>

  <line x1="548" y1="108" x2="580" y2="50" stroke="#13294b" stroke-width="2" marker-end="url(#navy)"/>
  <line x1="548" y1="115" x2="580" y2="115" stroke="#13294b" stroke-width="2" marker-end="url(#navy)"/>
  <line x1="548" y1="122" x2="580" y2="180" stroke="#13294b" stroke-width="2" marker-end="url(#navy)"/>

  <rect x="582" y="20" width="170" height="54" rx="10" fill="#ffffff" stroke="#13294b" stroke-width="1.5"/>
  <text x="667" y="43" font-size="13.5" font-weight="600" fill="#13294b">your Python code</text>
  <text x="667" y="62" font-size="11.5" fill="#5b6b82">to control a robot</text>

  <rect x="582" y="88" width="170" height="54" rx="10" fill="#ffffff" stroke="#13294b" stroke-width="1.5"/>
  <text x="667" y="111" font-size="13.5" font-weight="600" fill="#13294b">live view</text>
  <text x="667" y="130" font-size="11.5" fill="#5b6b82">in the terminal and in 3D</text>

  <rect x="582" y="156" width="170" height="54" rx="10" fill="#ffffff" stroke="#13294b" stroke-width="1.5"/>
  <text x="667" y="179" font-size="13.5" font-weight="600" fill="#13294b">other programs</text>
  <text x="667" y="198" font-size="11.5" fill="#5b6b82">any language, over UDP</text>
</svg>
