<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quest hand stream</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif; background: #0e1117; color: #e6edf3;
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
  }
  main { max-width: 540px; text-align: center; display: grid; gap: 20px; }
  h1 { font-size: 30px; font-weight: 700; }
  #status { font-size: 18px; line-height: 1.5; color: #9aa4b2; }
  #status.ok { color: #7ee2a8; }
  #status.bad { color: #ff9b9b; }
  button {
    justify-self: center; font-size: 24px; padding: 18px 56px; border: 0; border-radius: 14px;
    background: #4f7cff; color: #fff; cursor: pointer;
  }
  button:disabled { opacity: 0.35; cursor: default; }
  .hint { font-size: 15px; line-height: 1.6; color: #6e7781; }
  #hud {
    display: none; position: fixed; left: 50%; bottom: 8vh; transform: translateX(-50%);
    padding: 10px 18px; border-radius: 10px; background: rgba(10, 12, 20, 0.75);
    font: 600 18px ui-monospace, SFMono-Regular, Menlo, monospace; color: #e6edf3;
  }
</style>
</head>
<body>
<main>
  <h1>Quest hand stream</h1>
  <p id="status">Connecting to the computer…</p>
  <button id="start" disabled>Start</button>
  <p class="hint">Hands only: put the controllers down.<br>Press the Meta button to stop streaming.</p>
</main>
<div id="hud"></div>
<script>
"use strict";

const JOINTS = [
  "wrist",
  "thumb-metacarpal", "thumb-phalanx-proximal", "thumb-phalanx-distal", "thumb-tip",
  "index-finger-metacarpal", "index-finger-phalanx-proximal",
  "index-finger-phalanx-intermediate", "index-finger-phalanx-distal", "index-finger-tip",
  "middle-finger-metacarpal", "middle-finger-phalanx-proximal",
  "middle-finger-phalanx-intermediate", "middle-finger-phalanx-distal", "middle-finger-tip",
  "ring-finger-metacarpal", "ring-finger-phalanx-proximal",
  "ring-finger-phalanx-intermediate", "ring-finger-phalanx-distal", "ring-finger-tip",
  "pinky-finger-metacarpal", "pinky-finger-phalanx-proximal",
  "pinky-finger-phalanx-intermediate", "pinky-finger-phalanx-distal", "pinky-finger-tip",
];

// pack-begin
const MAGIC = 0x31534851;               // "QHS1"
const HAND_FLOATS = 25 * 7;             // per joint: x, y, z, qx, qy, qz, qw
const FLOATS = 7 + 2 * HAND_FLOATS;     // head, left hand, right hand
const HEADER_BYTES = 20;

function packFrame(seq, t, head, left, right) {
  const buffer = new ArrayBuffer(HEADER_BYTES + 4 * FLOATS);
  const view = new DataView(buffer);
  view.setUint32(0, MAGIC, true);
  view.setUint32(4, seq >>> 0, true);
  view.setFloat64(8, t, true);
  view.setUint8(16, (head ? 1 : 0) | (left ? 2 : 0) | (right ? 4 : 0));
  const body = new Float32Array(buffer, HEADER_BYTES, FLOATS);
  if (head) body.set(head, 0);
  if (left) body.set(left, 7);
  if (right) body.set(right, 7 + HAND_FLOATS);
  return buffer;
}
// pack-end

const statusEl = document.getElementById("status");
const startBtn = document.getElementById("start");
const hud = document.getElementById("hud");

function setStatus(text, kind) {
  statusEl.textContent = text;
  statusEl.className = kind || "";
}

// ------------------------------------------------------------------ link to the computer
let ws = null;

function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.binaryType = "arraybuffer";
  ws.onopen = () => {
    send({ hello: { agent: navigator.userAgent, webxr: !!navigator.xr } });
    if (session) return;
    if (!navigator.xr) {
      setStatus("WebXR is not available. Open this page in the Quest browser at http://localhost:"
                + location.port + " (USB, adb reverse).", "bad");
      return;
    }
    setStatus("Connected to the computer. Press Start.", "ok");
    startBtn.disabled = false;
  };
  ws.onclose = () => {
    startBtn.disabled = true;
    if (!session) setStatus("Waiting for the computer… is metaquest-teleop running on the computer?", "bad");
    setTimeout(connect, 1000);
  };
}

function send(message) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(message));
}

function fail(message) {
  setStatus(message, "bad");
  send({ error: message });
}

connect();

// ------------------------------------------------------------------------ XR session
let mode = "immersive-vr";
if (navigator.xr) {
  navigator.xr.isSessionSupported("immersive-ar").then((ok) => { if (ok) mode = "immersive-ar"; });
}

let session = null, refSpace = null, gl = null;
let seq = 0, framesThisSecond = 0, dropped = 0, lastSecond = 0;
const head = new Float32Array(7);
const hands = { left: new Float32Array(HAND_FLOATS), right: new Float32Array(HAND_FLOATS) };

startBtn.addEventListener("click", async () => {
  startBtn.disabled = true;
  try {
    session = await navigator.xr.requestSession(mode, {
      requiredFeatures: ["hand-tracking"],
      optionalFeatures: ["local-floor", "dom-overlay"],
      domOverlay: { root: hud },
    });
    const canvas = document.createElement("canvas");
    gl = canvas.getContext("webgl2", { xrCompatible: true })
      || canvas.getContext("webgl", { xrCompatible: true });
    session.updateRenderState({ baseLayer: new XRWebGLLayer(session, gl) });

    let space = "local-floor";
    try {
      refSpace = await session.requestReferenceSpace("local-floor");
    } catch {
      space = "local";
      refSpace = await session.requestReferenceSpace("local");
    }

    const rates = session.supportedFrameRates ? Array.from(session.supportedFrameRates) : [];
    if (rates.length && session.updateTargetFrameRate) {
      try { await session.updateTargetFrameRate(Math.max(...rates)); } catch { /* keep the default */ }
    }
    const fps = session.frameRate || (rates.length ? Math.max(...rates) : null);

    session.addEventListener("end", onEnd);
    session.addEventListener("frameratechange", () => send({ session: "framerate", fps: session.frameRate }));
    hud.style.display = "block";
    setStatus("Streaming. Press the Meta button to stop.", "ok");
    send({ session: "started", mode, space, fps, rates });
    session.requestAnimationFrame(onFrame);
  } catch (e) {
    if (session) { try { await session.end(); } catch { /* already ended */ } }
    session = null;
    startBtn.disabled = !(ws && ws.readyState === WebSocket.OPEN);
    fail(e.name === "NotSupportedError"
      ? "Hand tracking is unavailable: turn it on in Settings > Movement tracking and put the controllers down."
      : "Could not start: " + e.message);
  }
});

function onEnd() {
  session = null;
  hud.style.display = "none";
  send({ session: "ended" });
  setStatus("Stopped. Press Start to stream again.", "ok");
  startBtn.disabled = !(ws && ws.readyState === WebSocket.OPEN);
}

// ---------------------------------------------------------------------- every frame
function readPose(pose, out, offset) {
  const p = pose.transform.position, q = pose.transform.orientation;
  out[offset] = p.x; out[offset + 1] = p.y; out[offset + 2] = p.z;
  out[offset + 3] = q.x; out[offset + 4] = q.y; out[offset + 5] = q.z; out[offset + 6] = q.w;
}

function readHand(frame, hand, out) {
  for (let i = 0; i < JOINTS.length; i++) {
    const space = hand.get(JOINTS[i]);
    const pose = space && frame.getJointPose(space, refSpace);
    if (!pose) return false;
    readPose(pose, out, 7 * i);
  }
  return true;
}

function onFrame(t, frame) {
  session.requestAnimationFrame(onFrame);
  const layer = session.renderState.baseLayer;
  gl.bindFramebuffer(gl.FRAMEBUFFER, layer.framebuffer);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  if (ws.bufferedAmount > 16384) { dropped++; return; }

  const viewer = frame.getViewerPose(refSpace);
  if (viewer) readPose(viewer, head, 0);
  let left = null, right = null;
  for (const source of session.inputSources) {
    if (!source.hand) continue;
    if (source.handedness === "left" && readHand(frame, source.hand, hands.left)) left = hands.left;
    if (source.handedness === "right" && readHand(frame, source.hand, hands.right)) right = hands.right;
  }
  ws.send(packFrame(seq++, t / 1000, viewer ? head : null, left, right));

  framesThisSecond++;
  if (t - lastSecond >= 1000) {
    send({ stats: { fps: framesThisSecond, dropped } });
    hud.textContent = framesThisSecond + " Hz   left " + (left ? "✓" : "–") + "   right " + (right ? "✓" : "–");
    framesThisSecond = 0;
    lastSecond = t;
  }
}
</script>
</body>
</html>
